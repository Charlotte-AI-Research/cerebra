[project]
name = "cerebra"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain==0.2.16",
    "langchain-openai==0.1.23",
    "langchain-community==0.2.17",
    "langchain-core==0.2.43",
    "openai",
    "tiktoken",
    "requests",
    "beautifulsoup4",
    "lxml",
    "chromadb",
    "python-dotenv",
    "discord.py"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]